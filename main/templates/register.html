{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: url("{% static 'images/fon.jpg' %}") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 0;
        }

        .login-box {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            padding: 50px 40px;
            text-align: center;
            width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: fadeIn 1.2s ease forwards;
            box-sizing: border-box;
        }

        .login-box h2 {
            color: #fff;
            font-size: 2em;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .login-box form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transition: 0.3s ease;
            box-sizing: border-box;
        }

        .login-box input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .login-box input:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px #00e6ff;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 0 15px rgba(0, 183, 255, 0.5);
            box-sizing: border-box;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            color: #fff;
            text-decoration: none;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }

        .btn:hover {
            color: #00e6ff;
            text-shadow: 0 0 15px #00e6ff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: float 10s ease-in-out infinite;
            z-index: 0;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #0072ff;
            top: 10%;
            left: 15%;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #00ffcc;
            bottom: 15%;
            right: 10%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        @media (max-width: 480px) {
            .login-box {
                width: 85%;
                padding: 35px 25px;
            }
            .login-box h2 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="login-box">
        <h2>Реєстрація</h2>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Ім’я користувача" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <input type="password" name="password_confirm" placeholder="Підтвердження пароля" required>
            <button type="submit">Зареєструватися</button>
        </form>
        <p style="color: rgba(255, 255, 255, 0.8); margin-top: 20px; font-size: 0.95em;">
            Вже маєте обліковий запис? <a href="{% url 'login' %}" style="color: #00e6ff; text-decoration: none; font-weight: 600;">Увійдіть тут</a>
        </p>
    </div>
</body>
</html>
