<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Таблиця</title>
    </head>
    <body>
        <table border="1">
            <thead>
                <tr>
                    <th>Ім'я</th>
                    <th>Вік</th>
                    <th>Місто</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Іван</td>
                    <td>25</td>
                    <td>Київ</td>
                </tr>
                <tr>
                    <td>Марія</td>
                    <td>30</td>
                    <td>Харків</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
