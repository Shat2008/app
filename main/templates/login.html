{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: url("{% static 'images/fon.jpg' %}") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            z-index: 0;
        }

        .login-box {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            padding: 50px 40px;
            text-align: center;
            width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: fadeIn 1s ease forwards;
            box-sizing: border-box;
        }

        .login-box h2 {
            color: #fff;
            font-size: 2em;
            margin-bottom: 30px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        .login-box form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .login-box input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .login-box input:focus {
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.7);
        }

        button[type="submit"] {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00e6ff, #0072ff);
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        button[type="submit"]:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.8);
        }

        .register-btn {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .register-btn a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            display: block;
        }

        .register-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Плаваючі світлові кола */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: float 10s ease-in-out infinite;
            z-index: 0;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #0072ff;
            top: 15%;
            left: 10%;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #00ffcc;
            bottom: 10%;
            right: 10%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        @media (max-width: 480px) {
            .login-box {
                width: 85%;
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="login-box">
        <h2>Вхід</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Ім’я користувача" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Увійти</button>
        </form>
        <button class="register-btn">
            <a href="{% url 'register' %}">Реєстрація</a>
        </button>
    </div>
</body>
</html>
