{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>💬 Асистент сайту</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 30px;
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--surface);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px var(--shadow);
            transition: 0.3s;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .home-btn img {
            width: 28px;
            height: 28px;
        }

        .home-btn:hover {
            transform: scale(1.1);
            background: var(--surface);
        }

 
        #chat-box {
            border: 1px solid rgba(0,0,0,0.06);
            background: var(--surface);
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            border-radius: 10px;
            box-shadow: 0 6px 18px var(--shadow);
        }

        .user {
            color: var(--primary-1);
            margin-top: 10px;
            font-weight: bold;
        }

        .bot {
            color: var(--accent);
            margin-left: 20px;
            margin-top: 5px;
        }

        form {
            margin-top: 15px;
            display: flex;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.06);
            background: var(--muted);
            color: var(--text);
        }

        button {
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--primary-1), var(--primary-2));
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,68,255,0.12);
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <a href="{% url 'sait' %}" class="home-btn">
        <img src="{% static 'images/дом.png' %}" alt="Домой">
    </a>

    <h2>💬 Асистент сайту</h2>
    <div id="chat-box"></div>

    <div style="margin-top:12px">
        <label for="lang">Мова / Language: </label>
        <select id="lang">
            <option value="auto" selected>Автоматично / Automatic</option>
            <option value="uk">Українська</option>
            <option value="en">English</option>
            <option value="pl">Polski</option>
        </select>
    </div>

    <form id="chat-form">
        <input type="text" id="message" placeholder="Введите сообщение..." autocomplete="off">
        <button type="submit">Надіслати</button>
    </form>

    <script>
        const form = document.getElementById('chat-form');
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = input.value.trim();
            if (!msg) return;

            const lang = document.getElementById('lang').value || 'ru';

                chatBox.innerHTML += `<div class="user">Ви: ${msg}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const response = await fetch('/ask/', {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': getCookie('csrftoken'),
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({ message: msg, lang: lang })
            });

            const data = await response.json();
            chatBox.innerHTML += `<div class="bot">🤖 AI: ${data.answer}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
